version: "3.9"
   
services:

  db:
    image: postgis/postgis:14-3.2
    env_file:
      - .env
    restart: always
    ports: 
      - "5435:5436"
    logging:
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - ./data/db:/var/lib/postgresql/data
  test_db:
    image: postgis/postgis:14-3.2
    environment:
      POSTGRES_DB: mytestdb
      POSTGRES_USER: mytestuser
      POSTGRES_PASSWORD: mytestpassword
  app:
    depends_on:
      - db
    build: ./
    command: python3 ./manage.py runserver 0.0.0.0:8000
    
    # entrypoint: ["./wait-for-it.sh", "db:5434","--",'python3']
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
